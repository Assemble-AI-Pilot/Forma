<svg viewBox="0 0 1116 720" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<pattern id="byhand" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="6" stroke="#414042" stroke-width="0.7" opacity="0.4"/></pattern>
</defs>

<rect x="0" y="0" width="1116" height="720" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.5"/>

<text x="32" y="30" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0053E9">How a consultant contract moves through Forma</text>
<text x="32" y="48" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042">One contract record, from vendor selection to execution. The CRC Recommendation travels with it. Modelled on Clayton Carinish Road (CRC0209).</text>

<!-- ============ STEP 1 ============ -->
<rect x="32" y="96" width="260" height="494" rx="8" fill="#F7F7F3" stroke="#7FA9F4" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="48" y="122" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0053E9">1. Vendor selection</text>
<text x="48" y="142" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042">Preferred vendor, typically chosen by</text>
<text x="48" y="158" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042">competitive bid or tender rates</text>

<rect x="48" y="186" width="228" height="60" rx="4" fill="#E6EFFE" stroke="#0053E9" stroke-width="0.75"/>
<text x="58" y="208" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0053E9">Draft</text>
<text x="266" y="207" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042" opacity="0.6">draft</text>
<text x="58" y="225" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042">bot asks the RFIs, drafts the rec,</text>
<text x="58" y="239" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042">then raises the contract</text>

<line x1="162" y1="246" x2="162" y2="270" stroke="#0053E9" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="48" y="270" width="228" height="74" rx="4" fill="#FFFFFF" stroke="#0053E9" stroke-width="1" stroke-dasharray="3 2"/>
<text x="58" y="292" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0053E9">Pending Vendor Input</text>
<text x="266" y="291" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042" opacity="0.6">pending</text>
<text x="58" y="309" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042">bot sets the status only;</text>
<text x="58" y="323" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042">no email to the vendor</text>
<text x="58" y="337" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042">(to prove on the sandbox)</text>

<text x="48" y="546" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#414042">Document pack</text>
<rect x="48" y="554" width="112" height="26" rx="4" fill="#0053E9"/>
<text x="104" y="571" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">draft rec</text>
<rect x="164" y="554" width="112" height="26" rx="4" fill="#0053E9"/>
<text x="220" y="571" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">vendor proposal</text>

<!-- gate 1 to 2 -->
<text x="346" y="180" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#0053E9">when vendor</text>
<text x="346" y="194" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#0053E9">commercials</text>
<text x="346" y="208" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#0053E9">are finalised</text>
<path d="M276 307 L304 307 L304 223 L410 223" fill="none" stroke="#414042" stroke-width="1" marker-end="url(#arrow)"/>

<!-- ============ STEP 2 ============ -->
<rect x="388" y="96" width="340" height="494" rx="8" fill="#F7F7F3" stroke="#7FA9F4" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="404" y="122" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0053E9">2. Preferred to approved</text>
<text x="404" y="142" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042">Agreed terms go into Forma,</text>
<text x="404" y="158" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042">then the internal approval workflow</text>

<rect x="412" y="186" width="208" height="74" rx="4" fill="#FFFFFF" stroke="#0053E9" stroke-width="1" stroke-dasharray="3 2"/>
<text x="422" y="208" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0053E9">Update terms</text>
<text x="610" y="207" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042" opacity="0.6">stays pending</text>
<text x="422" y="225" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042">bot updates fee stages, scope,</text>
<text x="422" y="239" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042">special conditions and the rec</text>
<text x="422" y="253" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042">with what the vendor agreed</text>

<line x1="516" y1="260" x2="516" y2="280" stroke="#0053E9" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="412" y="280" width="208" height="60" rx="4" fill="#FFFFFF" stroke="#0053E9" stroke-width="1" stroke-dasharray="3 2"/>
<text x="422" y="302" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0053E9">Submitted</text>
<text x="610" y="301" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042" opacity="0.6">submitted</text>
<text x="422" y="319" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042">bot submits the updated</text>
<text x="422" y="333" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042">contract with the final rec</text>

<line x1="516" y1="340" x2="516" y2="360" stroke="#0053E9" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="412" y="360" width="208" height="60" rx="4" fill="url(#byhand)" stroke="#414042" stroke-width="0.75"/>
<text x="422" y="382" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#000000">In Review</text>
<text x="610" y="381" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042" opacity="0.6">inReview</text>
<text x="422" y="399" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042">bot presses Send once you say;</text>
<text x="422" y="413" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042">project lead approves first</text>

<line x1="516" y1="420" x2="516" y2="440" stroke="#414042" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="412" y="440" width="208" height="60" rx="4" fill="url(#byhand)" stroke="#414042" stroke-width="0.75"/>
<text x="422" y="462" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#000000">Approved (Sent)</text>
<text x="610" y="461" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042" opacity="0.6">sent</text>
<text x="422" y="479" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042">the last approver's Proceed</text>
<text x="422" y="493" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042">sets Sent; vendor gets a notice</text>

<!-- revise loop -->
<line x1="620" y1="390" x2="634" y2="390" stroke="#414042" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="636" y="360" width="80" height="60" rx="4" fill="url(#byhand)" stroke="#414042" stroke-width="0.75"/>
<text x="644" y="380" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#000000">Revise &amp;</text>
<text x="644" y="396" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#000000">Resubmit</text>
<text x="644" y="412" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042" opacity="0.6">revise</text>
<path d="M676 360 L676 310 L622 310" fill="none" stroke="#414042" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arrow)"/>

<text x="412" y="546" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#414042">Document pack</text>
<rect x="412" y="554" width="70" height="26" rx="4" fill="#0053E9"/>
<text x="447" y="571" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">final rec</text>
<rect x="486" y="554" width="80" height="26" rx="4" fill="#0053E9"/>
<text x="526" y="571" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">final scope</text>
<rect x="570" y="554" width="146" height="26" rx="4" fill="#0053E9"/>
<text x="643" y="571" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">final contract departures</text>

<!-- gate 2 to 3 -->
<text x="776" y="208" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#0053E9">once approved</text>
<path d="M620 470 L776 470 L776 223 L838 223" fill="none" stroke="#414042" stroke-width="1" marker-end="url(#arrow)"/>

<!-- ============ STEP 3 ============ -->
<rect x="824" y="96" width="260" height="494" rx="8" fill="#F7F7F3" stroke="#7FA9F4" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="840" y="122" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0053E9">3. Approved to executed</text>
<text x="840" y="142" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042">Draft agreement compiled and reviewed,</text>
<text x="840" y="158" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042">then signed by every party via DocuSign</text>

<rect x="840" y="186" width="228" height="74" rx="4" fill="#FFFFFF" stroke="#0053E9" stroke-width="1" stroke-dasharray="3 2"/>
<text x="850" y="208" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0053E9">Compile draft</text>
<text x="1058" y="207" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042" opacity="0.6">stays sent</text>
<text x="850" y="225" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042">bot compiles the pack into the</text>
<text x="850" y="239" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042">draft agreement from the</text>
<text x="850" y="253" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042">templates, and checks it</text>

<line x1="954" y1="260" x2="954" y2="280" stroke="#414042" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="840" y="280" width="228" height="60" rx="4" fill="url(#byhand)" stroke="#414042" stroke-width="0.75"/>
<text x="850" y="302" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#000000">Issue via DocuSign</text>
<text x="1058" y="301" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042" opacity="0.6">sent</text>
<text x="850" y="319" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042">a person sends it from Forma</text>
<text x="850" y="333" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042">to every party for signature</text>

<line x1="954" y1="340" x2="954" y2="360" stroke="#414042" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="840" y="360" width="228" height="60" rx="4" fill="url(#byhand)" stroke="#414042" stroke-width="0.75"/>
<text x="850" y="382" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#000000">Executed</text>
<text x="1058" y="381" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042" opacity="0.6">executed</text>
<text x="850" y="399" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042">a person sets it once signed;</text>
<text x="850" y="413" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042">auto only if e-signature is on</text>

<line x1="954" y1="420" x2="954" y2="440" stroke="#414042" stroke-width="1" opacity="0.5" marker-end="url(#arrow)"/>

<g opacity="0.5">
<rect x="840" y="440" width="228" height="46" rx="4" fill="url(#byhand)" stroke="#414042" stroke-width="0.75"/>
<text x="850" y="462" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#000000">Closed</text>
<text x="1058" y="461" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042" opacity="0.6">closed</text>
<text x="850" y="478" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042">when the engagement ends</text>
</g>

<text x="840" y="546" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#414042">Document pack</text>
<rect x="840" y="554" width="112" height="26" rx="4" fill="#0053E9"/>
<text x="896" y="571" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">agreement</text>

<!-- legend -->
<line x1="32" y1="606" x2="1084" y2="606" stroke="#7FA9F4" stroke-width="0.5" opacity="0.5"/>

<rect x="32" y="616" width="22" height="14" rx="3" fill="#E6EFFE" stroke="#0053E9" stroke-width="0.75"/>
<text x="62" y="627" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042">contract-bot does it today</text>

<rect x="232" y="616" width="22" height="14" rx="3" fill="#FFFFFF" stroke="#0053E9" stroke-width="1" stroke-dasharray="3 2"/>
<text x="262" y="627" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042">contract-bot will do it (to build)</text>

<rect x="478" y="616" width="22" height="14" rx="3" fill="url(#byhand)" stroke="#414042" stroke-width="0.75"/>
<text x="508" y="627" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042">a person does it in Forma</text>

<rect x="674" y="616" width="22" height="14" rx="3" fill="#0053E9"/>
<text x="704" y="627" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042">document pack</text>

<text x="32" y="656" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042">Every box is the same contract record. Down a column = its status changing; across = the next of Assemble's three steps. Grey tags are Forma's API status.</text>
<text x="32" y="672" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042">"Stays pending" and "stays sent" mark work done while the contract sits in that status. Forma has no Approved status for contracts: approval lands as Sent.</text>
<text x="32" y="688" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042">Every contract matches an approval workflow, so Send always goes to In Review. The bot presses Send only after you confirm it in chat.</text>
<text x="32" y="704" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#414042">Autodesk's Request Supplier Input also emails the vendor. The bot sets Pending Vendor Input without that email, and proves it on the sandbox first.</text>
</svg>
